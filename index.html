<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ تشكيلات السباعي (7v7)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / العنوان -->
    <div class="header-container">
        <h1>⚽ منشئ تشكيلات السباعي (7v7)</h1>
        <p>اسحب أصدقاءك لتغيير مراكزهم - اضغط للتعديل</p>
    </div>

    <!-- Controls / أدوات التحكم -->
    <div class="controls-bar">
        <div>
            <span>التشكيلة (7 لاعبين):</span>
            <select id="formationSelect">
                <option value="2-3-1">2-3-1 (هجومي)</option>
                <option value="3-2-1">3-2-1 (متوازن)</option>
                <option value="3-1-2">3-1-2 (هجومي مضاعف)</option>
                <option value="2-2-2">2-2-2 (كلاسيكي)</option>
            </select>
        </div>
        <button id="resetLineupBtn">إعادة تعيين</button>
    </div>

    <!-- Main Content / المحتوى الرئيسي -->
    <div class="main-content">
        <!-- Pitch / الملعب -->
        <div class="pitch-container">
            <div id="pitch">
                <!-- العناصر سيتم إنشاؤها عبر JavaScript -->
            </div>
        </div>

        <!-- Sidebar / القائمة الجانبية -->
        <div class="sidebar">
            <!-- Stats / الإحصائيات -->
            <div class="stats-box">
                <h3>📊 إحصائيات الفريق</h3>
                <div class="stat-item">
                    <span id="avgRating">0</span>
                    <span>متوسط التقييم</span>
                </div>
            </div>

            <!-- Edit Player / تعديل بيانات الصديق -->
            <div class="edit-box">
                <h3>✏️ تعديل بيانات الصديق</h3>
                <div id="editArea">
                    <label>اسم الصديق:</label>
                    <input type="text" id="playerNameInput" placeholder="مثلاً: علي عبيد">

                    <label>رقم اللاعب:</label>
                    <input type="number" id="playerNumberInput" placeholder="مثلاً: 10" min="1" max="99">

                    <label>التقييم (OVR):</label>
                    <input type="number" id="playerRatingInput" placeholder="مثلاً: 88" min="40" max="99">

                    <label>المركز:</label>
                    <select id="playerPositionInput">
                        <option value="GK">حارس مرمى (GK)</option>
                        <option value="CB">قلب دفاع (CB)</option>
                        <option value="LB">ظهير أيسر (LB)</option>
                        <option value="RB">ظهير أيمن (RB)</option>
                        <option value="CMF">وسط (CMF)</option>
                        <option value="AMF">وسط هجومي (AMF)</option>
                        <option value="LWF">جناح أيسر (LWF)</option>
                        <option value="RWF">جناح أيمن (RWF)</option>
                        <option value="CF">مهاجم (CF)</option>
                    </select>
                    
                    <label for="playerImageInput">اختر صورة الصديق:</label>
                    <input type="file" id="playerImageInput" accept="image/*">
                    
                    <button id="savePlayerChangesBtn">حفظ التعديلات</button>
                </div>
            </div>
        </div>
    </div>

    <!-- قالب بطاقة اللاعب -->
    <template id="playerCardTemplate">
        <div class="player-card-container">
            <div class="player-head-container">
                <img src="" alt="Player" class="player-head-img">
            </div>
            <div class="player-card-stats-area">
                <div class="player-stats-row">
                    <span class="player-position-text">CF</span>
                    <span class="player-number-text">#10</span>
                    <span class="player-rating-text">88</span>
                </div>
                <div class="player-name-text">الاسم</div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
