<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشكيلة كرة القدم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-container">
        <h2>التشكيلة (7 لاعبين):</h2>
    </div>

    <div class="controls-bar">
        <select id="formationSelect">
            <option value="2-3-1">2-3-1 (هجومي)</option>
            <option value="3-2-1">3-2-1 (دفاعي)</option>
            <option value="3-1-2">3-1-2 (متوازن)</option>
            <option value="2-2-2">2-2-2 (مزدوج)</option>
        </select>
        <button id="saveLineupBtn" style="background:#2196F3;">💾 حفظ التشكيلة</button>
        <button id="resetLineupBtn" style="background:#f44336;">إعادة تعيين</button>
    </div>

    <!-- الملعب الخضراء المخطط طولي المدمج مباشرة بالخلفية -->
    <div id="pitch">
        <div id="playersContainer"></div>
    </div>

    <!-- قسم تعديل اللاعب -->
    <div class="sidebar">
        <h3>تعديل بيانات اللاعب المحدد:</h3>
        <div class="edit-box">
            <label>الاسم:</label>
            <input type="text" id="playerNameInput" placeholder="اسم اللاعب">

            <label>الرقم:</label>
            <input type="number" id="playerNumberInput" placeholder="الرقم">

            <label>التقييم:</label>
            <input type="number" id="playerRatingInput" placeholder="85">

            <label>المركز:</label>
            <select id="playerPositionInput">
                <option value="GK">حارس (GK)</option>
                <option value="CB">مدافع (CB)</option>
                <option value="LB">ظهير أيسر (LB)</option>
                <option value="RB">ظهير أيمن (RB)</option>
                <option value="CMF">وسط (CMF)</option>

                <option value="AMF">صانع ألعاب (AMF)</option>
                <option value="RWF">جناح أيمن (RWF)</option>
                <option value="LWF">جناح أيسر (LWF)</option>
                <option value="CF">مهاجم (CF)</option>
            </select>

            <label>الصورة الشخصية:</label>
            <input type="file" id="playerImageInput" accept="image/*">

            <button id="savePlayerChangesBtn">تحديث بيانات اللاعب</button>
        </div>
    </div>

    <div class="sidebar" style="margin-top: 15px;">
        <h3>📊 إحصائيات الفريق</h3>
        <p>معدل تقييم الفريق: <strong id="avgRating">0</strong></p>
    </div>

    <template id="playerCardTemplate">
        <div class="player-card-container">
            <div class="player-head-container">
                <img class="player-head-img" src="" alt="Player">
            </div>
            <div class="player-card-stats-area">
                <span class="player-position-text">RB</span>
                <span class="player-rating-text">83</span>
            </div>
            <div class="player-name-text">K. WALKER</div>
        </div>
    </template>


    <script src="script.js"></script>
</body>
</html>
</div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
