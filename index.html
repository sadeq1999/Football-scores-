<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشكيلة كرة القدم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-container">
        <h2>التشكيلة (7 لاعبين):</h2>
    </div>

    <div class="controls-bar">
        <select id="formationSelect">
            <option value="2-3-1">2-3-1 (هجومي)</option>
            <option value="3-2-1">3-2-1 (دفاعي)</option>
            <option value="3-1-2">3-1-2 (متوازن)</option>
            <option value="2-2-2">2-2-2 (مزدوج)</option>
        </select>
        <button id="saveLineupBtn" style="background:#2196F3;">💾 حفظ التشكيلة</button>
        <button id="resetLineupBtn" style="background:#f44336;">إعادة تعيين</button>
    </div>

    <!-- الملعب الخضراء المخطط بشكل طولي -->
    <div id="pitch">
        <!-- تخطيط الملعب الطولي SVG -->
        <svg class="pitch-lines" viewBox="0 0 100 150" preserveAspectRatio="none">
            <!-- الحدود الخارجية -->
            <rect x="2" y="2" width="96" height="146" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
            <!-- خط المنتصف -->
            <line x1="2" y1="75" x2="98" y2="75" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
            <!-- دائرة المنتصف -->
            <circle cx="50" cy="75" r="15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
            <circle cx="50" cy="75" r="1" fill="rgba(255,255,255,0.8)"/>

            <!-- منطقة المرمى العليا -->
            <rect x="25" y="2" width="50" height="22" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
            <rect x="35" y="2" width="30" height="8" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
            <circle cx="50" cy="18" r="0.8" fill="white"/>

            <!-- منطقة المرمى السفلى -->
            <rect x="25" y="126" width="50" height="22" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
            <rect x="35" y="140" width="30" height="8" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
            <circle cx="50" cy="132" r="0.8" fill="white"/>

            <!-- أركان الملعب -->
            <path d="M 2 7 A 5 5 0 0 0 7 2" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
            <path d="M 93 2 A 5 5 0 0 0 98 7" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
            <path d="M 2 143 A 5 5 0 0 0 7 148" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
            <path d="M 98 143 A 5 5 0 0 0 93 148" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
        </svg>

        <!-- سيتم توليد بطاقات اللاعبين هنا برمجياً -->
        <div id="playersContainer"></div>
    </div>

    <!-- قسم تعديل اللاعب -->
    <div class="sidebar">
        <h3>تعديل بيانات اللاعب المحدد:</h3>
        <div class="edit-box">
            <label>الاسم:</label>
            <input type="text" id="playerNameInput" placeholder="اسم اللاعب">

            <label>الرقم:</label>
            <input type="number" id="playerNumberInput" placeholder="الرقم">

            <label>التقييم:</label>
            <input type="number" id="playerRatingInput" placeholder="85">

            <label>المركز:</label>
            <select id="playerPositionInput">
                <option value="GK">حارس (GK)</option>
                <option value="CB">مدافع (CB)</option>
                <option value="LB">ظهير أيسر (LB)</option>
                <option value="RB">ظهير أيمن (RB)</option>
                <option value="CMF">وسط (CMF)</option>
                <option value="AMF">صانع ألعاب (AMF)</option>
                <option value="RWF">جناح أيمن (RWF)</option>
                <option value="LWF">جناح أيسر (LWF)</option>
                <option value="CF">مهاجم (CF)</option>
            </select>

            <label>الصورة الشخصية:</label>
            <input type="file" id="playerImageInput" accept="image/*">

            <button id="savePlayerChangesBtn">تحديث بيانات اللاعب</button>
        </div>
    </div>

    <div class="sidebar" style="margin-top: 15px;">
        <h3>📊 إحصائيات الفريق</h3>
        <p>معدل تقييم الفريق: <strong id="avgRating">0</strong></p>
    </div>

    <template id="playerCardTemplate">
        <div class="player-card-container">
            <div class="player-head-container">
                <img class="player-head-img" src="" alt="Player">
            </div>
            <div class="player-card-stats-area">
                <div class="player-stats-row">
                    <span class="player-rating-text">85</span>
                    <span class="player-number-text">#1</span>
                    <span class="player-position-text">CMF</span>
                </div>
                <div class="player-name-text">لاعب</div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
